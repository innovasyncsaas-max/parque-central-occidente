<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Comunicados — PCO3</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #1e3a5f;
      --accent2: #2563eb;
      --gbtn:    linear-gradient(135deg, #1e3a5f, #2563eb);
      --bg:      #eef2f7;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── Header ── */
    .header {
      background: var(--gbtn);
      padding: 20px 20px 28px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      top: -60px; right: -50px;
      pointer-events: none;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .btn-back-header {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 10px;
      color: #fff;
      width: 38px; height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      transition: background .15s;
    }

    .btn-back-header:active { background: rgba(255,255,255,0.25); }

    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      flex: 1;
    }

    .header-sub {
      font-size: 13px;
      opacity: .75;
      padding-left: 50px;
    }

    /* ── Filter bar ── */
    .filter-bar {
      background: #fff;
      padding: 14px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid #e8edf3;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .chip-all       { background: var(--gbtn); color: #fff; }
    .chip-urgente   { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
    .chip-general   { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .chip-mantenim  { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .chip-convivenc { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }

    .chip.active { box-shadow: 0 2px 10px rgba(30,58,95,0.18); transform: scale(1.04); }
    .chip-all.active { background: var(--gbtn); }

    /* ── Content ── */
    .content {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── Loading / empty ── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .state-msg .icon { font-size: 48px; margin-bottom: 12px; }
    .state-msg h3 { font-family: 'DM Serif Display', serif; color: #64748b; margin-bottom: 8px; }
    .state-msg p  { font-size: 14px; line-height: 1.6; }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Comunicado card ── */
    .com-card {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(30,58,95,0.07);
      transition: transform .15s, box-shadow .15s;
    }

    .com-card:active { transform: scale(0.99); }

    .com-stripe {
      height: 4px;
      width: 100%;
    }

    .stripe-urgente   { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .stripe-general   { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }
    .stripe-mantenim  { background: linear-gradient(90deg, #b45309, #f59e0b); }
    .stripe-convivenc { background: linear-gradient(90deg, #059669, #10b981); }

    .com-body {
      padding: 16px 18px 18px;
    }

    .com-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .badge-urgente   { background: #fee2e2; color: #b91c1c; }
    .badge-general   { background: #dbeafe; color: #1d4ed8; }
    .badge-mantenim  { background: #fef3c7; color: #92400e; }
    .badge-convivenc { background: #d1fae5; color: #065f46; }

    .com-date {
      font-size: 12px;
      color: #94a3b8;
      margin-left: auto;
    }

    .com-title {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .com-text {
      font-size: 14px;
      color: #475569;
      line-height: 1.7;
    }

    .com-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .com-vigencia {
      font-size: 12px;
      color: #94a3b8;
      flex: 1;
    }

    .pin-badge {
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── Back to portal ── */
    .footer-nav {
      max-width: 600px;
      margin: 8px auto 0;
      padding: 0 16px;
    }

    .btn-portal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      background: var(--gbtn);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(37,99,235,0.25);
      transition: transform .15s;
    }

    .btn-portal:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <a id="btnBack" href="#" class="btn-back-header" onclick="volver(event)">←</a>
      <div class="header-title">Comunicados</div>
    </div>
    <div class="header-sub" id="headerSub">Ciudadela Parque Central de Occidente 3</div>
  </div>

  <!-- Filter chips -->
  <div class="filter-bar" id="filterBar">
    <button class="chip chip-all active"       data-cat="todos"      onclick="filtrar(this)">Todos</button>
    <button class="chip chip-urgente"           data-cat="urgente"    onclick="filtrar(this)">🔴 Urgente</button>
    <button class="chip chip-general"           data-cat="general"    onclick="filtrar(this)">🔵 General</button>
    <button class="chip chip-mantenim"          data-cat="mantenimiento" onclick="filtrar(this)">🟡 Mantenimiento</button>
    <button class="chip chip-convivenc"         data-cat="convivencia"   onclick="filtrar(this)">🟢 Convivencia</button>
  </div>

  <!-- Content -->
  <div class="content" id="content">
    <div class="state-msg" id="loadingMsg">
      <div class="spinner"></div>
      <p>Cargando comunicados…</p>
    </div>
  </div>

  <!-- Footer nav -->
  <div class="footer-nav">
    <a id="btnPortal" href="#" class="btn-portal" onclick="volver(event)">
      ← Volver al Portal
    </a>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection,
             getDocs, query, where,
             orderBy, Timestamp }        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyD3fprcNthKNU8fguyxdHC60pQ2T0PH5Ek",
      authDomain:        "registro-residentes.firebaseapp.com",
      projectId:         "registro-residentes",
      storageBucket:     "registro-residentes.firebasestorage.app",
      messagingSenderId: "396188616265",
      appId:             "1:646123326163:web:8b35b955e7b3692536a226"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    window._fbGetComunicados = async () => {
      const now   = Timestamp.now();
      const colRef = collection(db, 'comunicados');

      // Fetch active comunicados where fechaVigencia >= now
      const q = query(
        colRef,
        where('activo', '==', true),
        where('fechaVigencia', '>=', now),
        orderBy('fechaVigencia', 'asc')
      );

      const snap = await getDocs(q);
      const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Sort: pinned first, then by fechaPublicacion desc
      docs.sort((a, b) => {
        if (a.fijado && !b.fijado) return -1;
        if (!a.fijado && b.fijado) return 1;
        const ta = a.fechaPublicacion?.toMillis?.() ?? 0;
        const tb = b.fechaPublicacion?.toMillis?.() ?? 0;
        return tb - ta;
      });

      return docs;
    };
  </script>

  <script>
    /* ── State ──────────────────────────────────────────────────────────── */
    let allComunicados = [];
    let activeFilter   = 'todos';

    /* ── Session / URL helpers ──────────────────────────────────────────── */
    function getParams() {
      try {
        const s = JSON.parse(sessionStorage.getItem('residente_pco3') || '{}');
        if (s.torre) return s;
      } catch (_) {}
      const p = new URLSearchParams(window.location.search);
      return { torre: p.get('torre') || '', apto: p.get('apto') || '', nombre: p.get('nombre') || '', tel: p.get('tel') || '' };
    }

    function getPortalURL() {
      const p = getParams();
      if (p.torre) {
        const qs = new URLSearchParams({ torre: p.torre, apto: p.apto || '', tel: p.tel || '', nombre: p.nombre || '' });
        return `https://my.innovasync.org/v2/preview/Vd2uWSeIIuPxUX95nQaO?${qs}`;
      }
      return 'https://my.innovasync.org/v2/preview/Vd2uWSeIIuPxUX95nQaO';
    }

    function volver(e) {
      e.preventDefault();
      window.location.href = getPortalURL();
    }

    /* ── Helpers ──────────────────────────────────────────────────────────── */
    const CAT_LABEL = {
      urgente:      'Urgente',
      general:      'General',
      mantenimiento:'Mantenimiento',
      convivencia:  'Convivencia',
    };

    function fmtDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
    }

    function fmtVigencia(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return `Vigente hasta ${d.toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' })}`;
    }

    /* ── Render ──────────────────────────────────────────────────────────── */
    function renderCards(list) {
      const container = document.getElementById('content');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="state-msg">
            <div class="icon">📭</div>
            <h3>Sin comunicados</h3>
            <p>No hay comunicados activos${activeFilter !== 'todos' ? ' en esta categoría' : ''} en este momento.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(com => {
        const cat    = (com.categoria || 'general').toLowerCase();
        const label  = CAT_LABEL[cat] || cat;
        const pinned = com.fijado ? `<span class="pin-badge">📌 Fijado</span>` : '';

        return `
        <div class="com-card">
          <div class="com-stripe stripe-${cat === 'mantenimiento' ? 'mantenim' : cat === 'convivencia' ? 'convivenc' : cat}"></div>
          <div class="com-body">
            <div class="com-meta">
              <span class="cat-badge badge-${cat === 'mantenimiento' ? 'mantenim' : cat === 'convivencia' ? 'convivenc' : cat}">${label}</span>
              <span class="com-date">${fmtDate(com.fechaPublicacion)}</span>
            </div>
            <div class="com-title">${escHtml(com.titulo || 'Sin título')}</div>
            <div class="com-text">${escHtml(com.contenido || '').replace(/\n/g, '<br>')}</div>
            <div class="com-footer">
              <span class="com-vigencia">${fmtVigencia(com.fechaVigencia)}</span>
              ${pinned}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ── Filter ──────────────────────────────────────────────────────────── */
    function filtrar(el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      activeFilter = el.dataset.cat;

      const filtered = activeFilter === 'todos'
        ? allComunicados
        : allComunicados.filter(c => (c.categoria || 'general').toLowerCase() === activeFilter);

      renderCards(filtered);
    }

    /* ── Load ──────────────────────────────────────────────────────────── */
    async function load() {
      // Update header
      const p = getParams();
      if (p.nombre) {
        document.getElementById('headerSub').textContent = `Hola, ${p.nombre} · Torre ${p.torre} Apto ${p.apto}`;
      }

      // Set back links
      const url = getPortalURL();
      document.getElementById('btnBack').href   = url;
      document.getElementById('btnPortal').href = url;

      // Wait for Firebase to be ready (max 5 s)
      let attempts = 0;
      while (!window._fbGetComunicados && attempts++ < 50) {
        await new Promise(r => setTimeout(r, 100));
      }

      if (!window._fbGetComunicados) {
        document.getElementById('content').innerHTML = `
          <div class="state-msg">
            <div class="icon">⚠️</div>
            <h3>Error de conexión</h3>
            <p>No se pudo cargar los comunicados. Verifica tu conexión e intenta de nuevo.</p>
          </div>`;
        return;
      }

      try {
        allComunicados = await window._fbGetComunicados();
        renderCards(allComunicados);
      } catch (err) {
        console.error('[Comunicados]', err);
        document.getElementById('content').innerHTML = `
          <div class="state-msg">
            <div class="icon">⚠️</div>
            <h3>Error al cargar</h3>
            <p>Ocurrió un problema al obtener los comunicados. Intenta más tarde.</p>
          </div>`;
      }
    }

    load();
  </script>

</body>
</html>
